<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Guard AIoT - Dashboard</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <link rel="stylesheet" href="../src/css/dashboard.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>🌊 Flood Guard AIoT - Hệ thống cảnh báo lũ</h1>
            <div class="header-time" id="currentTime"></div>
        </header>

        <!--Part 1: Grid 3x3 shows 9 areas-->
        <section class="stations-grid" id="stationsGrid">
            <!-- 9 ô trạm sẽ được tạo động bằng JavaScript -->
        </section>

        <!-- Bottom Section: Chart and Notifications -->
        <div class="bottom-section">
            <!--Part 2: Charts and Dropdown-->
            <section class="chart-section">
                <div class="chart-controls">
                    <select id="chart-mode-select" class="chart-select">
                        <option value="realtime-rain">🌧️ Lượng mưa Realtime</option>
                        <option value="realtime-drainage">🚰 Thoát nước Realtime</option>
                        <option value="realtime-tide">🌊 Thủy triều Realtime</option>
                        <option value="history-rain-6h">📊 Lượng mưa 6 tiếng</option>
                        <option value="history-tide-6h">📈 Thủy triều 6 tiếng</option>
                    </select>
                    <select id="station-select" class="station-select">
                        <!-- Sẽ được tạo động từ JS -->
                    </select>
                </div>
                <div class="chart-wrapper">
                    <canvas id="flood-chart-canvas"></canvas>
                </div>
            </section>

            <!--Part 3: Notification list-->
            <section class="alert-section">
                <h3>📢 Thông báo hệ thống</h3>
                <ul class="notification-feed" id="notification-feed">
                    <li class="alert-item status-safe"><span class="alert-time">Bây giờ</span>🟢 Hệ thống đang hoạt động bình thường</li>
                </ul>
            </section>
        </div>
    </div>

    <!-- SỬA LỖI: 5 dòng script bên dưới trước đây trỏ sai tên file (dashboard.js, chartHandler.js,
         stationManager.js, alertManager.js không tồn tại) và THIẾU hẳn api.js.
         => api.js không được nạp nên fetchLatestData()/fetchHistoryData() bị "undefined",
         => chart.js, stations.js, notification.js cũng không được nạp nên toàn bộ giao diện không chạy.
         Đã đổi lại đúng tên 5 file thực tế, giữ nguyên thứ tự logic (api -> app -> stations -> chart -> notification). -->
    <script src="../src/js/api.js"></script>
    <script src="../src/js/app.js"></script>
    <script src="../src/js/stations.js"></script>
    <script src="../src/js/chart.js"></script>
    <script src="../src/js/notification.js"></script>
</body>
</html>
